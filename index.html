<title>Daily Quest</title>
<style>
:root{--bg:#07080c;--s1:#0f111a;--s2:#161926;--s3:#1d2133;--card:var(--s1);--bd:rgba(255,255,255,.08);--bd2:rgba(139,92,246,.4);--tx:#eef0f8;--mu:#9097ae;--ac:#8b5cf6;--ac2:#3bc3ff;--ok:#3ddc97;--bad:#ff6b7a;--warn:#ffcf6b;--hdr:rgba(7,8,12,.84);--sh:0 8px 24px rgba(0,0,0,.28);--gl:0 0 22px rgba(139,92,246,.28);color-scheme:dark}
[data-theme=light]{--bg:#eef0f6;--s1:#fff;--s2:#f7f8fc;--s3:#e6e9f3;--bd:rgba(20,24,40,.1);--bd2:rgba(109,64,230,.35);--tx:#141726;--mu:#586080;--ok:#119b63;--bad:#d63a4d;--warn:#a96d00;--hdr:rgba(238,240,246,.88);--sh:0 6px 18px rgba(30,40,90,.1);--gl:0 4px 16px rgba(109,64,230,.16);color-scheme:light}
[data-theme=light]{--ac2:#0a78b8}
[data-theme=light] .pts,[data-theme=light] .amt.big,[data-theme=light] #lvup b{background-image:linear-gradient(135deg,#6d40e6,#0a78b8)}
[data-theme=light] .pt{background:rgba(10,120,184,.09);border-color:rgba(10,120,184,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(120% 50% at 50% -8%,rgba(139,92,246,.17),transparent 62%),var(--bg);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--hdr);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:calc(10px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--bd)}
.hud{display:flex;align-items:center;gap:14px;max-width:640px;margin:auto}
.lv{width:54px;height:54px;border-radius:17px;background:linear-gradient(145deg,#9a6bff,#4f7dff 70%,#3bc3ff);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;line-height:1;color:#fff;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 0 20px rgba(110,90,255,.5)}
.lv::before{content:"LV";font-size:10px;font-weight:700;letter-spacing:.08em;opacity:.8;margin-bottom:2px}
.hx{flex:1;min-width:0}.hx b{font-size:17px;font-weight:700}.hx small{color:var(--mu);font-size:13px}
.pts{position:relative;text-align:right;font-weight:800;font-size:26px;line-height:1;background:linear-gradient(135deg,#c4b0ff,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pts small{display:block;color:var(--mu);-webkit-text-fill-color:var(--mu);font-weight:500;font-size:12px;margin-top:3px}
#pp{display:inline-block}
.bar{height:10px;border-radius:6px;background:var(--s3);overflow:hidden;margin:6px 0;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.bar.lg{height:12px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 10px rgba(80,150,255,.55);transition:none}
main{padding:16px;max-width:640px;margin:auto}
h2{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu);font-weight:650;letter-spacing:.02em;margin:24px 2px 10px}
h2 .ct{font-size:12px;font-weight:700;color:var(--tx);background:var(--s3);border-radius:10px;padding:1px 8px}
h3{margin:0 0 12px;font-size:20px}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,var(--sh)}
.hero{border-color:var(--bd2);box-shadow:var(--gl),0 1px 0 rgba(255,255,255,.05) inset}
.hero .dt{font-size:19px;font-weight:750}.fr{font-size:20px;font-weight:800}
.q{display:flex;align-items:center;gap:12px}
.qi{font-size:22px;width:46px;height:46px;display:grid;place-items:center;background:var(--s3);border:1px solid var(--bd);border-radius:14px;flex:none}
.qb{flex:1;min-width:0}.qb b{display:block;font-size:16.5px;font-weight:650;line-height:1.25}
.qb small,small{color:var(--mu);font-size:13px}.ds{display:block;margin-top:2px}
.mt{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.pt{font-weight:800;font-size:13px;color:var(--ac2);background:rgba(59,195,255,.1);border:1px solid rgba(59,195,255,.28);border-radius:999px;padding:1px 9px}
.tg{font-size:12px;color:var(--mu);background:var(--s3);border-radius:7px;padding:2px 8px}.tg.ph{color:var(--warn)}
.qc{position:relative;overflow:hidden}
.qc.ready::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--ac),var(--ac2))}
.qc.done{border-color:rgba(61,220,151,.4);background:linear-gradient(180deg,rgba(61,220,151,.09),var(--s1))}
.qc.done .qi{background:linear-gradient(145deg,#2fcf8a,#1c9f78);border-color:transparent;color:#04130c;font-weight:800;box-shadow:0 0 14px rgba(61,220,151,.4)}
.qc.done .qb b{color:var(--mu)}
.qc.locked,.qc.paused{border-style:dashed;box-shadow:none;background:var(--s1)}
.qc.locked .qi,.qc.paused .qi{opacity:.5;filter:grayscale(1)}.qc.locked .qb b,.qc.paused .qb b{color:var(--mu)}
.btn{background:linear-gradient(135deg,#8b5cf6,#5b7cff);color:#fff;border:0;border-radius:13px;padding:12px 18px;font:650 15px inherit;font-family:inherit;min-height:46px;box-shadow:0 4px 14px rgba(100,90,255,.35);transition:transform .12s}
.btn:active{transform:scale(.96)}.btn.sm{padding:10px 16px;min-height:44px}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx);box-shadow:none}.btn.bad{background:linear-gradient(135deg,#ff6b7a,#d63a5d);box-shadow:none}.btn:disabled{opacity:.38;box-shadow:none}
.chip{font-size:13px;font-weight:600;color:var(--mu);border:1px solid var(--bd);background:var(--s3);border-radius:20px;padding:7px 12px;white-space:nowrap}.chip.ok{color:var(--ok);border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.1)}
.lnk{background:none;border:0;color:var(--ac2);font:inherit;font-weight:600;padding:10px 0 0;min-height:44px;min-width:56px;text-align:left}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--hdr);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{position:relative;flex:1;background:none;border:0;color:var(--mu);padding:9px 0 7px;font:600 12px inherit;font-family:inherit;min-height:58px}
nav button span{display:block;height:26px}nav svg{display:block;margin:0 auto 2px}
nav button.on{color:var(--ac2)}nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 12px var(--ac2)}
label{display:block;margin:12px 0;font-size:14px;color:var(--mu)}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font:16px inherit;font-family:inherit;margin-top:5px}
input[type=checkbox]{width:auto;margin-right:8px}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.days{display:flex;gap:6px;margin:8px 0}.day{flex:1;min-height:44px;border-radius:11px;border:1px solid var(--bd);background:var(--s3);color:var(--mu);font:650 14px inherit}.day.on{background:linear-gradient(135deg,var(--ac),#5b7cff);border-color:transparent;color:#fff}
#modal{position:fixed;inset:0;background:rgba(2,3,8,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:flex-end;z-index:10}#modal.open{display:flex}
.sheet{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--bd2);border-bottom:0;width:100%;max-width:640px;margin:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:up .22s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet img{width:100%;border-radius:12px;margin:8px 0}
#err{color:var(--bad);font-size:14px;min-height:18px}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:linear-gradient(135deg,var(--ac),#5b7cff);color:#fff;padding:11px 20px;border-radius:26px;font-weight:700;box-shadow:var(--gl);opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mu);padding:28px 12px;border:1px dashed var(--bd);border-radius:18px;margin-bottom:12px}
.amt{font-weight:800}.amt.big{font-size:38px;line-height:1.1;background:linear-gradient(135deg,#c4b0ff,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}.pos{color:var(--ok)}.neg{color:var(--bad)}
.tier .tp{font-size:22px;font-weight:800}.tier.aff{border-color:var(--bd2);box-shadow:var(--gl),var(--sh)}
#xb.anim{transition:width .7s cubic-bezier(.2,.8,.2,1)}
#gn{position:absolute;right:0;top:100%;pointer-events:none}
.gain{display:block;font-size:17px;-webkit-text-fill-color:var(--ok);color:var(--ok);animation:gain 1.2s ease-out both}
@keyframes gain{0%{opacity:0;transform:translateY(2px) scale(.8)}15%{opacity:1;transform:translateY(8px) scale(1.1)}100%{opacity:0;transform:translateY(30px)}}
#pp.bump{animation:bump .45s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}
.qc.just{animation:done .7s ease-out}.qc.just .qi{animation:chk .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes done{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}60%{box-shadow:0 0 0 10px rgba(61,220,151,0)}}
@keyframes chk{from{transform:scale(.4) rotate(-20deg)}}
#lvup{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:30;background:radial-gradient(circle at 50% 45%,rgba(139,92,246,.38),transparent 62%);animation:lvf 2.4s both}
#lvup div{text-align:center;padding:22px 40px;border-radius:24px;background:var(--s2);border:1px solid var(--bd2);box-shadow:var(--gl),0 0 60px rgba(59,195,255,.28);animation:lvr .55s cubic-bezier(.2,1.3,.3,1)}
#lvup small{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--ac2)}
#lvup b{display:block;font-size:38px;line-height:1.15;background:linear-gradient(135deg,#c4b0ff,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes lvf{0%{opacity:0}12%,80%{opacity:1}100%{opacity:0}}
@keyframes lvr{from{transform:scale(.6);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="hud"><div class="lv" id="lv">1</div><div class="hx"><b id="xt">XP</b><div class="bar"><i id="xb"></i></div><small id="xs"></small></div><div class="pts"><span id="pp">0</span><small>points</small><i id="gn"></i></div></div></header>
<main id="main"></main>
<nav id="nav"></nav><div id="modal"></div><div id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
// ---- calendar periods (all from LOCAL date parts, so DST-safe) ----
const dKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const weekKey=d=>{const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return dKey(m)}; // Monday start
const monKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const periodOf=(q,d)=>q.freq==='daily'?dKey(d):q.freq==='weekly'?weekKey(d):monKey(d);
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ORD=[1,2,3,4,5,6,0];
const dn=a=>a.length===7?'Daily':ORD.filter(d=>a.includes(d)).map(d=>DN[d]).join(' ');
// ---- IndexedDB ----
const STORES=['quests','completions','progress','ledger','redemptions','wishlist','photos','meta'];
let db,S={},view='dash',PH=null,PEND=null,FX=null,EQ=null,curDay='',busy=false;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('dailyquest',1);r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const all=s=>new Promise((res,rej)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const getP=id=>new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(st,fn)=>new Promise((res,rej)=>{const t=db.transaction(st,'readwrite'),o={};st.forEach(s=>o[s]=t.objectStore(s));try{fn(o)}catch(e){t.abort();return rej(e)}t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('aborted'))});
// ---- seed quests ----
const D7=[0,1,2,3,4,5,6];
const mk=(id,name,cat,freq,points,o={})=>({id,name,cat,freq,points,desc:'',days:D7,target:1,photo:'none',note:false,confirm:'',distinct:false,active:true,paused:false,archived:false,optional:false,...o});
const OPT=[['Brush and floss teeth','Health','daily',2],['Complete a 10-minute room reset','Home','daily',2],['Stretch or do mobility work','Health','daily',2],['Practice a skill for 20 minutes','Growth','daily',3],['Prepare clothes and essentials for tomorrow','Life','daily',2],['Finish laundry and put it away','Home','weekly',4],['Review spending and transactions','Money','weekly',3],['Plan the upcoming week','Life','weekly',3],['Clean and organize the car','Home','weekly',4]];
const SEED=[mk('bed','Make bed','Home','daily',1,{photo:'req'}),mk('bible','Read Bible','Growth','daily',1,{note:true,desc:'Optional: note what you read'}),mk('water','Drink 1 gallon of water','Health','daily',3,{desc:'Hydration goal'}),mk('book','Read one chapter of any book','Growth','daily',2,{note:true}),mk('ontime','Get to work on time','Work','daily',2,{days:'work',desc:'Self-reported'}),mk('workout','Work out','Health','daily',5,{days:[1,2,3,4,5]}),mk('friends','Text at least 3 friends','Social','weekly',3,{target:3,distinct:true,desc:'Each friend counts once'}),mk('room','Full clean room','Home','weekly',10,{days:[6,0],photo:'req'}),mk('hysa','Deposit at least $200 into an HYSA','Money','monthly',15,{confirm:'I deposited at least $200 into my HYSA this month.'}),...OPT.map((o,i)=>mk('opt'+i,o[0],o[1],o[2],o[3],{active:false,optional:true}))];
async function seed(){const m=await all('meta');if(m.some(x=>x.id==='seeded'))return;await tx(['quests','meta'],o=>{SEED.forEach(q=>o.quests.put(q));o.meta.put({id:'seeded'})})}
async function load(){
 const [quests,comps,prog,ledger,reds,wish,meta]=await Promise.all(['quests','completions','progress','ledger','redemptions','wishlist','meta'].map(all));
 S={quests,comps:Object.fromEntries(comps.map(c=>[c.id,c])),prog:Object.fromEntries(prog.map(p=>[p.id,p])),ledger,reds,wish,set:{workdays:[1,2,3,4,5],levelBase:50,...(meta.find(m=>m.id==='settings')||{})}};
 curDay=dKey(new Date());render()}
// ---- accounting (balances derived from ledger) ----
const bal=()=>{let xp=0,pts=0;S.ledger.forEach(l=>{if(l.type==='earn'){xp+=l.xp;pts+=l.points}else pts-=l.points});return{xp,pts}};
const lvl=xp=>Math.floor((1+Math.sqrt(1+8*xp/S.set.levelBase))/2),th=L=>S.set.levelBase*L*(L-1)/2;
const days=q=>q.days==='work'?S.set.workdays:q.days;
function qs(q){const n=new Date(),id=q.id+'|'+periodOf(q,n),pr=S.prog[id],done=!!S.comps[id],here=days(q).includes(n.getDay());
 return{id,done,step:pr?pr.steps.length:0,pr,ok:!done&&q.active&&!q.paused&&here,locked:!done&&!here}}
async function commit(q,{label,note,photo}){
 const now=new Date(),p=periodOf(q,now),id=q.id+'|'+p;
 if(S.comps[id])throw new Error('Already completed for this period');
 const pr=S.prog[id]||{id,questId:q.id,period:p,steps:[]},steps=[...pr.steps,{ts:now.getTime(),label:label||''}],done=steps.length>=(q.target||1),pid=photo&&done?'ph|'+id+'|'+now.getTime():null;
 await tx(['progress','completions','ledger','photos'],o=>{
  o.progress.put({...pr,steps});
  if(done){if(pid)o.photos.put({id:pid,data:photo});
   o.completions.add({id,questId:q.id,name:q.name,cat:q.cat,freq:q.freq,period:p,ts:now.getTime(),points:q.points,note:note||'',photoId:pid,steps});
   o.ledger.add({id:'c:'+id,ts:now.getTime(),type:'earn',points:q.points,xp:q.points,desc:q.name,ref:id})}});
 return done}
async function run(q,o){if(busy)return;busy=true;try{const L0=lvl(bal().xp),done=await commit(q,o);FX={done,qid:q.id,pts:q.points,L0};await load();closeM();
  toast(done?`+${q.points} pts · ${esc(q.name)}`:`Logged ${S.prog[qs(q).id].steps.length}/${q.target}`);}
 catch(e){const m=e&&e.name==='QuotaExceededError'?'Storage full. Export a backup and free space.':(e.message||'Could not save');$('#err')?$('#err').textContent=m:toast(m);await load()}finally{busy=false;FX=null}}
// ---- feedback animations: purely visual, triggered only by a successful commit (FX is set in run()) ----
const RM=()=>matchMedia('(prefers-reduced-motion:reduce)').matches,pctOf=(x,L)=>(x-th(L))/(th(L+1)-th(L))*100;
function barTo(xp,L){const x=$('#xb'),go=!!(FX&&FX.done)&&!RM(),up=go&&L>FX.L0;x.classList.toggle('anim',go);
 if(up){x.style.width='100%';setTimeout(()=>{const v=bal().xp;x.classList.remove('anim');x.style.width='0%';void x.offsetWidth;x.classList.add('anim');x.style.width=pctOf(v,lvl(v))+'%'},650)}else x.style.width=pctOf(xp,L)+'%'}
function playFX(L){const f=FX;if(!f||!f.done)return;FX=null;
 const c=$(`[data-qid="${f.qid}"]`);if(c)c.classList.add('just');
 const g=$('#gn'),pp=$('#pp');g.innerHTML=`<b class="gain">+${f.pts}</b>`;pp.classList.add('bump');setTimeout(()=>{g.innerHTML='';pp.classList.remove('bump')},1300);
 if(L>f.L0){const o=document.createElement('div');o.id='lvup';o.innerHTML=`<div><small>LEVEL UP</small><b>Level ${L}</b></div>`;document.body.appendChild(o);setTimeout(()=>o.remove(),2400)}}
// ---- UI helpers ----
const modal=h=>{$('#modal').innerHTML=`<div class="sheet">${h}</div>`;$('#modal').classList.add('open')};
const closeM=()=>{$('#modal').classList.remove('open');PH=null;PEND=null};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m.replace(/&amp;/g,'&');t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)};
const fmt=ts=>new Date(ts).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
const CI={Home:'🏠',Growth:'📖',Health:'💪',Work:'💼',Social:'💬',Money:'💰',Life:'✨'};
function qcard(q,manage){const s=qs(q),t=q.target||1,st=s.done?'done':q.paused?'paused':s.locked?'locked':'ready';let b;
 if(s.done)b='<span class="chip ok">✓ Completed</span>';else if(q.paused)b='<span class="chip">Paused</span>';else if(s.locked)b=`<span class="chip">${dn(days(q))}</span>`;

const RULES={
quests:q=>first([[/^[A-Za-z0-9_-]{1,60}$/.test(q.id),'id may only use letters, numbers, - and _'],[isStr(q.name)&&q.name.trim()&&q.name.length<=60,'name is missing or invalid'],[isStr(q.cat)&&q.cat.length<=60,'category is missing or invalid'],[FREQ.includes(q.freq),'frequency must be daily, weekly or monthly'],[isInt(q.points,1,100),'points must be a whole number from 1 to 100'],[q.days==='work'||okDays(q.days),'days are invalid'],[isInt(q.target,1,31),'target must be a whole number from 1 to 31'],[['none','opt','req'].includes(q.photo),'photo setting is invalid'],[optS(q.desc)&&optS(q.confirm),'text fields are invalid'],[optB(q.note)&&optB(q.distinct)&&optB(q.active)&&optB(q.paused)&&optB(q.archived)&&optB(q.optional),'yes/no fields are invalid']]),
completions:c=>first([[isStr(c.questId)&&isStr(c.name)&&optS(c.cat),'quest fields are invalid'],[FREQ.includes(c.freq),'frequency is invalid'],[isStr(c.period)&&PRE[c.freq]&&PRE[c.freq].test(c.period),'period is invalid'],[c.id===c.questId+'|'+c.period,'id does not match quest and period'],[isNum(c.ts)&&c.ts>0,'timestamp is invalid'],[isInt(c.points,0,1e6),'points are invalid'],[optS(c.note),'note is invalid'],[c.photoId==null||isStr(c.photoId),'photo reference is invalid'],[okSteps(c.steps)&&c.steps.length>=1,'steps are invalid']]),
progress:p=>first([[isStr(p.questId)&&isStr(p.period)&&/^\d{4}-\d\d(-\d\d)?$/.test(p.period),'quest or period is invalid'],[p.id===p.questId+'|'+p.period,'id does not match quest and period'],[okSteps(p.steps),'steps are invalid']]),
ledger:l=>first([[l.type==='earn'||l.type==='spend','type must be earn or spend'],[isNum(l.ts)&&l.ts>0,'timestamp is invalid'],[isInt(l.points,0,1e6),'points must be a whole number of 0 or more'],[isNum(l.xp)&&l.xp>=0,'xp is invalid'],[l.type==='earn'?l.xp===l.points:l.xp===0,'xp does not match the point rules'],[isStr(l.desc)&&isStr(l.ref),'description or reference is invalid'],[l.id===(l.type==='earn'?'c:':'s:')+l.ref,'id does not match its reference']]),
redemptions:r=>first([[isNum(r.ts)&&r.ts>0,'timestamp is invalid'],[TIERS.some(t=>t[0]===r.tier&&t[1]===r.limit),'tier and spending limit do not match a reward tier'],[r.points===r.tier,'points do not match the tier'],[isStr(r.item)&&r.item.trim().length>0,'item is missing'],[r.amount===null||(isNum(r.amount)&&r.amount>=0&&r.amount<=r.limit),'amount is invalid']]),
wishlist:w=>first([[isStr(w.name)&&w.name.trim().length>0,'name is missing'],[isNum(w.price)&&w.price>0,'price must be above 0'],[optS(w.notes),'notes are invalid']]),
photos:p=>first([[isStr(p.data)&&/^data:image\/(jpeg|png|webp);base64,/.test(p.data),'photo data is not an image']]),
meta:m=>m.id==='seeded'?'':m.id==='settings'?first([[okDays(m.workdays),'workdays are invalid'],[isInt(m.levelBase,5,1000),'level base must be a whole number from 5 to 1000']]):'unknown setting "'+String(m.id).slice(0,30)+'"'};
function validateBackup(j){
 if(!isObj(j)||j.app!=='dailyquest')return 'This is not a Daily Quest backup file.';
 if(!Number.isInteger(j.version)||j.version<1)return 'The backup has no valid version number.';
 if(j.version>1)return 'This backup was made by a newer version of the app (format '+j.version+'). Update the app first.';
 if(!isObj(j.data))return 'The backup has no data section.';
 for(const st of STORES){const a=j.data[st];if(!Array.isArray(a))return `The "${st}" section is missing or not a list.`;
  const seen=new Set();for(let i=0;i<a.length;i++){const x=a[i],w=`${st} record ${i+1}: `;
   if(!isObj(x)||!isStr(x.id)||!x.id||x.id.length>300)return w+'must be an object with a text id.';
   if(seen.has(x.id))return w+'duplicate id.';seen.add(x.id);const m=RULES[st](x);if(m)return w+m+'.'}}
 const D=j.data,C=Object.fromEntries(D.completions.map(c=>[c.id,c])),R=Object.fromEntries(D.redemptions.map(r=>[r.id,r])),L=Object.fromEntries(D.ledger.map(l=>[l.id,l]));let e=0,sp=0;
 for(const l of D.ledger){if(l.type==='earn'){e+=l.points;if(!C[l.ref]||C[l.ref].points!==l.points)return `ledger entry "${l.id}" has no matching completion.`}else{sp+=l.points;if(!R[l.ref]||R[l.ref].points!==l.points)return `ledger entry "${l.id}" has no matching redemption.`}}
 for(const c of D.completions)if(!L['c:'+c.id])return `completion "${c.id}" has no point entry.`;
 for(const r of D.redemptions)if(!L['s:'+r.id])return `redemption "${r.id}" has no point entry.`;
 if(sp>e)return 'Spent points exceed earned points, so the balance would be negative.';
 return ''}
const BKERR=m=>modal(`<h3>Backup not restored</h3><p>${esc(m)}</p><p><small>Nothing was changed. Your current data is untouched.</small></p><button class="btn" data-a="close" style="width:100%">Close</button>`);
async function imp(f){let j;
 try{j=JSON.parse(await f.text())}catch(e){return BKERR('That file is not valid JSON, so it cannot be a Daily Quest backup.')}
 const err=validateBackup(j);if(err)return BKERR(err);
 PEND=j;const d=j.data;
 modal(`<h3>Replace current data?</h3><p>Restoring <b>replaces everything currently in this app</b>: quests, history, points, photos, wishlist, redemptions, and the workday and level settings.</p><p><small>Backup from ${esc(isStr(j.exported)?j.exported.slice(0,10):'unknown date')}: ${d.quests.length} quests, ${d.completions.length} completions, ${d.photos.length} photos, ${d.redemptions.length} redemptions, ${d.wishlist.length} wishlist items. Theme and last-backup date are stored separately on this device, are not in the backup, and stay as they are.</small></p>
 <div class="row"><button class="btn ghost" data-a="rexp">Export current data first</button><small id="rx"></small></div><div id="err"></div>
 <div class="row" style="margin-top:12px"><button class="btn ghost" data-a="close">Cancel</button><button class="btn bad" data-a="rest">Replace data</button></div>`)}
// ---- refresh triggers ----
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&db)load()});
addEventListener('pageshow',()=>{if(db)load()});addEventListener('focus',()=>{if(db)tick()});setInterval(tick,15000);
document.documentElement.dataset.theme=localStorage.theme||'dark';
(async()=>{try{db=await openDB();await seed();await load()}catch(e){$('#main').innerHTML='<div class="card"><b>Storage unavailable</b><br>This browser is blocking local storage (private mode?). Open the app in a normal Safari tab.</div>';return}
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
